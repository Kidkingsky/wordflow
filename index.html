"做棒式時要啟動核心。"},{"id":"w_fitness_06","kind":"word","category":"fitness","level":"A2","english":"stretch","chinese":"伸展","note":"動詞／名詞｜延展肌肉與關節的動作。","example":"Stretch your legs after running.","exampleChinese":"跑步後伸展腿部。"},{"id":"w_fitness_07","kind":"word","category":"fitness","level":"A2","english":"sore","chinese":"痠痛的","note":"形容詞｜通常指運動後肌肉痠痛。","example":"My legs are sore today.","exampleChinese":"我今天腿很痠。"},{"id":"w_fitness_08","kind":"word","category":"fitness","level":"B1","english":"endurance","chinese":"耐力","note":"名詞｜長時間維持運動的能力。","example":"Cycling can improve your endurance.","exampleChinese":"騎自行車能提升耐力。"},{"id":"w_fitness_09","kind":"word","category":"fitness","level":"B1","english":"resistance","chinese":"阻力","note":"名詞｜訓練時對抗的重量或阻力。","example":"Increase the resistance slowly.","exampleChinese":"慢慢增加阻力。"},{"id":"w_fitness_10","kind":"word","category":"fitness","level":"A2","english":"recovery","chinese":"恢復","note":"名詞｜運動後讓身體修復的過程。","example":"Sleep is important for recovery.","exampleChinese":"睡眠對恢復很重要。"},{"id":"w_fitness_11","kind":"word","category":"fitness","level":"B1","english":"fatigue","chinese":"疲勞","note":"名詞｜體力或精神耗損的狀態。","example":"Stop if you feel unusual fatigue.","exampleChinese":"如果感到異常疲勞就停止。"},{"id":"w_fitness_12","kind":"word","category":"fitness","level":"A2","english":"balance","chinese":"平衡","note":"名詞／動詞｜維持身體穩定的能力。","example":"Practice your balance on one leg.","exampleChinese":"練習單腳站立的平衡。"},{"id":"w_work_01","kind":"word","category":"work","level":"A2","english":"update","chinese":"更新；進度","note":"名詞／動詞｜提供最新狀態或修改內容。","example":"Can you give me a quick update?","exampleChinese":"你可以簡短更新一下進度嗎？"},{"id":"w_work_02","kind":"word","category":"work","level":"A2","english":"deadline","chinese":"截止期限","note":"名詞｜任務必須完成的最後時間。","example":"The deadline is next Friday.","exampleChinese":"截止日是下週五。"},{"id":"w_work_03","kind":"word","category":"work","level":"A2","english":"request","chinese":"請求；需求","note":"名詞／動詞｜正式或禮貌提出需要。","example":"We received a new request.","exampleChinese":"我們收到新的需求。"},{"id":"w_work_04","kind":"word","category":"work","level":"A2","english":"approve","chinese":"核准","note":"動詞｜正式同意某項計畫或要求。","example":"The manager approved the design.","exampleChinese":"主管核准了這份設計。"},{"id":"w_work_05","kind":"word","category":"work","level":"A2","english":"issue","chinese":"問題；議題","note":"名詞｜需要處理的狀況或議題。","example":"There is an issue with the login page.","exampleChinese":"登入頁面有個問題。"},{"id":"w_work_06","kind":"word","category":"work","level":"B1","english":"deploy","chinese":"部署；發布","note":"動詞｜把應用程式或更新放到指定環境。","example":"We will deploy the update tonight.","exampleChinese":"我們今晚會部署更新。"},{"id":"w_work_07","kind":"word","category":"work","level":"A2","english":"review","chinese":"檢視；審查","note":"動詞／名詞｜仔細檢查內容或成果。","example":"Please review the changes.","exampleChinese":"請檢查這些修改。"},{"id":"w_work_08","kind":"word","category":"work","level":"A2","english":"feedback","chinese":"回饋；意見","note":"名詞｜對工作成果提出的建議。","example":"Thanks for your feedback.","exampleChinese":"謝謝你的回饋。"},{"id":"w_work_09","kind":"word","category":"work","level":"B1","english":"prioritize","chinese":"排定優先順序","note":"動詞｜先處理重要或急迫的事項。","example":"We need to prioritize this task.","exampleChinese":"我們需要優先處理這項任務。"},{"id":"w_work_10","kind":"word","category":"work","level":"B1","english":"workaround","chinese":"暫時解法；替代方案","note":"名詞｜正式修復前可行的繞道作法。","example":"We found a temporary workaround.","exampleChinese":"我們找到一個暫時的替代方案。"},{"id":"w_work_11","kind":"word","category":"work","level":"B1","english":"clarify","chinese":"釐清","note":"動詞｜讓不清楚的事情變明確。","example":"Could you clarify this requirement?","exampleChinese":"你可以釐清這項需求嗎？"},{"id":"w_work_12","kind":"word","category":"work","level":"A2","english":"estimate","chinese":"估計","note":"名詞／動詞｜推估工時、費用或數量。","example":"Can you estimate the time needed?","exampleChinese":"你可以估計需要多久嗎？"},{"id":"p_travel_01","kind":"phrase","category":"travel","level":"A2","english":"I’d like to check in.","chinese":"我想辦理入住。","note":"飯店櫃台｜開場時禮貌表達入住需求。","example":"I’d like to check in. I have a reservation.","exampleChinese":"我想辦理入住，我有訂房。"},{"id":"p_travel_02","kind":"phrase","category":"travel","level":"A2","english":"Could we have a table for four?","chinese":"請問有四人座嗎？","note":"餐廳｜詢問座位。","example":"Could we have a table for four near the window?","exampleChinese":"請問有靠窗的四人座嗎？"},{"id":"p_travel_03","kind":"phrase","category":"travel","level":"A2","english":"Where is the boarding gate?","chinese":"登機門在哪裡？","note":"機場｜尋找登機門。","example":"Excuse me, where is the boarding gate?","exampleChinese":"不好意思，請問登機門在哪裡？"},{"id":"p_travel_04","kind":"phrase","category":"travel","level":"A2","english":"Could you take a picture for us?","chinese":"可以幫我們拍照嗎？","note":"旅遊景點｜請路人幫忙拍合照。","example":"Could you take a picture for us, please?","exampleChinese":"可以麻煩你幫我們拍一張照片嗎？"},{"id":"p_travel_05","kind":"phrase","category":"travel","level":"B1","english":"Is breakfast included?","chinese":"有包含早餐嗎？","note":"飯店｜確認訂房內容。","example":"Is breakfast included in the room rate?","exampleChinese":"房價有包含早餐嗎？"},{"id":"p_travel_06","kind":"phrase","category":"travel","level":"B1","english":"Can we leave our bags here?","chinese":"可以把行李寄放這裡嗎？","note":"飯店｜退房後詢問寄放行李。","example":"Can we leave our bags here until three?","exampleChinese":"我們可以寄放行李到三點嗎？"},{"id":"p_daily_01","kind":"phrase","category":"daily","level":"A2","english":"I’m on my way.","chinese":"我正在過去的路上。","note":"日常聯絡｜告知對方你正在前往。","example":"I’m on my way. I’ll be there in ten minutes.","exampleChinese":"我正在過去，十分鐘後到。"},{"id":"p_daily_02","kind":"phrase","category":"daily","level":"A2","english":"Give me a minute.","chinese":"給我一分鐘。","note":"日常對話｜需要一點時間時。","example":"Give me a minute. I’m almost ready.","exampleChinese":"給我一分鐘，我快準備好了。"},{"id":"p_daily_03","kind":"phrase","category":"daily","level":"A2","english":"That sounds good to me.","chinese":"我覺得這樣不錯。","note":"日常對話｜同意別人的提議。","example":"Dinner at six? That sounds good to me.","exampleChinese":"六點吃晚餐？我覺得不錯。"},{"id":"p_daily_04","kind":"phrase","category":"daily","level":"A2","english":"I’m not sure yet.","chinese":"我還不確定。","note":"日常對話｜還沒決定。","example":"I’m not sure yet. Let me check.","exampleChinese":"我還不確定，讓我確認一下。"},{"id":"p_daily_05","kind":"phrase","category":"daily","level":"B1","english":"It slipped my mind.","chinese":"我一時忘記了。","note":"日常對話｜承認忘了某件事。","example":"Sorry, it completely slipped my mind.","exampleChinese":"抱歉，我完全忘記了。"},{"id":"p_daily_06","kind":"phrase","category":"daily","level":"B1","english":"Let’s play it by ear.","chinese":"到時候再看情況決定。","note":"日常對話｜不先把每個細節定死。","example":"We can play it by ear depending on the weather.","exampleChinese":"我們可以依天氣狀況到時候再決定。"},{"id":"p_fitness_01","kind":"phrase","category":"fitness","level":"A2","english":"Keep your back straight.","chinese":"背部保持挺直。","note":"教練指導｜提醒動作時注意背部位置。","example":"Keep your back straight during the movement.","exampleChinese":"動作過程中背部保持挺直。"},{"id":"p_fitness_02","kind":"phrase","category":"fitness","level":"A2","english":"Take a short break.","chinese":"短暫休息一下。","note":"訓練中｜告訴學員先休息。","example":"Take a short break between sets.","exampleChinese":"組間短暫休息一下。"},{"id":"p_fitness_03","kind":"phrase","category":"fitness","level":"A2","english":"Breathe out as you lift.","chinese":"舉起時吐氣。","note":"教練指導｜提醒施力與呼吸節奏。","example":"Breathe out as you lift the weight.","exampleChinese":"把重量舉起時吐氣。"},{"id":"p_fitness_04","kind":"phrase","category":"fitness","level":"A2","english":"How many reps do you have left?","chinese":"你還剩幾下？","note":"訓練中｜詢問剩餘次數。","example":"How many reps do you have left in this set?","exampleChinese":"這一組你還剩幾下？"},{"id":"p_fitness_05","kind":"phrase","category":"fitness","level":"B1","english":"Focus on controlled movement.","chinese":"專注在有控制的動作。","note":"教練指導｜強調動作控制而非速度。","example":"Focus on controlled movement, not speed.","exampleChinese":"專注於動作控制，而不是速度。"},{"id":"p_fitness_06","kind":"phrase","category":"fitness","level":"B1","english":"Let’s adjust the intensity.","chinese":"我們來調整強度。","note":"教練指導｜依學員狀況調整訓練。","example":"Let’s adjust the intensity to match your energy today.","exampleChinese":"我們依照你今天的精神體力調整強度。"},{"id":"p_work_01","kind":"phrase","category":"work","level":"A2","english":"Could you give me an update?","chinese":"可以跟我更新一下進度嗎？","note":"工作溝通｜禮貌地追蹤進度。","example":"Could you give me an update on the project?","exampleChinese":"可以更新一下專案進度嗎？"},{"id":"p_work_02","kind":"phrase","category":"work","level":"A2","english":"Let me check and get back to you.","chinese":"我確認後再回覆你。","note":"工作溝通｜資料尚未確認時使用。","example":"Let me check and get back to you this afternoon.","exampleChinese":"我確認後，今天下午再回覆你。"},{"id":"p_work_03","kind":"phrase","category":"work","level":"A2","english":"We’re working on it.","chinese":"我們正在處理。","note":"工作溝通｜回報進行中的工作。","example":"We’re working on it and will share an update soon.","exampleChinese":"我們正在處理，稍後會更新進度。"},{"id":"p_work_04","kind":"phrase","category":"work","level":"A2","english":"Could we move the meeting?","chinese":"可以改會議時間嗎？","note":"工作安排｜詢問是否能改期。","example":"Could we move the meeting to Friday?","exampleChinese":"我們可以把會議改到星期五嗎？"},{"id":"p_work_05","kind":"phrase","category":"work","level":"B1","english":"We need to align on the requirements.","chinese":"我們需要對齊需求共識。","note":"專案討論｜確認大家對需求的理解一致。","example":"We need to align on the requirements before coding.","exampleChinese":"開始寫程式前，我們要先對齊需求。"},{"id":"p_work_06","kind":"phrase","category":"work","level":"B1","english":"Let’s address the root cause.","chinese":"我們來處理根本原因。","note":"技術討論｜不只修表面症狀。","example":"Let’s address the root cause instead of applying another patch.","exampleChinese":"我們來處理根本原因，而不是再補一個修補程式。"}]</script>
<script>
'use strict';
const ITEMS=JSON.parse(document.getElementById('data').textContent);
const labels={all:'全部',travel:'旅遊',daily:'生活',fitness:'健身',work:'工作'};
const key='wordflow_browser_demo_01';
let state={category:'all',level:'A2',favorites:[],records:{},rate:0.84};
try {const saved=JSON.parse(localStorage.getItem(key)||'null');if(saved&&typeof saved==='object')state={...state,...saved};} catch(e) {}
let tab='home';let query='';let categoryFilter='all';let kindFilter='all';
const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const el=id=>document.getElementById(id);
const day=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const daysFromToday=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
function save(){try{localStorage.setItem(key,JSON.stringify(state));}catch(e){}}
function eligible(kind){return ITEMS.filter(x=>x.kind===kind&&(state.category==='all'||x.category===state.category)&&x.level===state.level)}
function pick(kind,offset=0){const xs=eligible(kind);if(!xs.length)return null;const d=new Date();const ordinal=Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000);return xs[(ordinal+offset+(kind==='phrase'?7:0))%xs.length];}
function due(){return ITEMS.filter(x=>state.records[x.id]&&state.records[x.id].next<=day());}
function reviewedToday(){return Object.values(state.records).filter(r=>r.last===day()).length;}
function learned(){return Object.keys(state.records).length;}
function header(title,description){return `<div class="eyebrow">WORD FLOW · YOUR DAILY ENGLISH</div><h1 class="title">${title}</h1><div class="muted">${description}</div>`}
function topics(){return `<div class="chip-row">${Object.entries(labels).map(([id,n])=>`<button class="chip ${state.category===id?'active':''}" data-topic="${id}">${n}</button>`).join('')}</div>`}
function card(x,compact=false){if(!x)return '';const saved=state.favorites.includes(x.id);let reviewed=state.records[x.id]?.last===day();return `<article class="card"><div class="card-head"><span class="tag ${x.kind==='phrase'?'phrase':''}">${x.kind==='word'?'WORD':'PHRASE'} · ${esc(labels[x.category])} · ${esc(x.level)}</span><button class="little-btn ${saved?'saved':''}" data-action="favorite" data-id="${x.id}" title="收藏">${saved?'★':'☆'}</button></div><div class="word ${x.kind==='phrase'?'phrase-word':''}">${esc(x.english)}</div><p class="zh">${esc(x.chinese)}</p>${x.note?`<p class="note">${esc(x.note)}</p>`:''}<div class="example"><p>${esc(x.example)}</p><small>${esc(x.exampleChinese)}</small></div><div class="actions"><button class="btn listen" data-action="speak" data-id="${x.id}">▶ 朗讀</button><button class="btn weak" data-action="miss" data-id="${x.id}">${reviewed?'再練一次':'不太熟'}</button><button class="btn good" data-action="remember" data-id="${x.id}">${reviewed?'再記一次':'記住了 ✓'}</button></div></article>`}
function home(){const w=pick('word'),p=pick('phrase');const pct=Math.round(Math.min(100,(reviewedToday()/6)*100));return `${header('今天，學點英文。','不用背很多，每天一個單字、一句實用英文就很好。')}<div style="height:16px"></div><section class="hero"><div class="eyebrow" style="color:#a4e9dc">TODAY'S JOURNEY</div><h2>每天進步一點點</h2><div class="small">今日已練習</div><div style="margin-top:9px"><strong>${reviewedToday()}</strong> <span class="small">/ 建議 6 題</span></div><div class="hero-bar"><span style="width:${pct}%"></span></div><div class="muted" style="font-size:11px;margin-top:10px">目前教材 72 筆 · 本機儲存練習紀錄</div></section>${topics()}<div class="section-head"><h3>✦ 今日推薦單字</h3><span class="count">${state.level}</span></div>${card(w)}<div class="section-head"><h3>✦ 今日實用詞句</h3><span class="count">每日一句</span></div>${card(p)}<button class="btn big listen" data-nav="library">探索更多單字與詞句 →</button><p class="footer-note">手機體驗版 · 使用 Flutter 正式 App 的同一批英文教材</p>`}
function libraryRows(){const term=query.trim().toLowerCase();let xs=ITEMS.filter(x=>(categoryFilter==='all'||x.category===categoryFilter)&&(kindFilter==='all'||x.kind===kindFilter)&&(!term||[x.english,x.chinese,x.note,x.example].join(' ').toLowerCase().includes(term)));return `<div class="section-head"><h3>找到 ${xs.length} 筆教材</h3><span class="count">共 72 筆</span></div>`+ (xs.length? xs.map(x=>`<div class="list-row"><div class="grow"><span class="tag ${x.kind==='phrase'?'phrase':''}">${x.kind==='word'?'單字':'詞句'} · ${x.level}</span><b style="margin-top:9px">${esc(x.english)}</b><small>${esc(x.chinese)} · ${esc(labels[x.category])}</small></div><button class="play" data-action="speak" data-id="${x.id}" title="朗讀">▶</button><button class="little-btn ${state.favorites.includes(x.id)?'saved':''}" data-action="favorite" data-id="${x.id}">${state.favorites.includes(x.id)?'★':'☆'}</button></div>`).join(''):`<div class="empty">沒有符合條件的單字。試試其他關鍵字。</div>`)}
function library(){return `${header('單字與詞句庫','搜尋 48 個單字與 24 句英文，也能收藏喜歡的教材。')}<input class="search" id="search" placeholder="搜尋英文、中文或例句" value="${esc(query)}" inputmode="search"><div class="row" style="margin-top:10px"><select class="select" id="catFilter">${Object.entries(labels).map(([id,n])=>`<option value="${id}" ${categoryFilter===id?'selected':''}>${n}主題</option>`).join('')}</select><select class="select" id="kindFilter"><option value="all">全部種類</option><option value="word" ${kindFilter==='word'?'selected':''}>單字</option><option value="phrase" ${kindFilter==='phrase'?'selected':''}>詞句</option></select></div><div id="libraryRows">${libraryRows()}</div>`}
function review(){const xs=due();return `${header('溫故知新','記住的內容會依照 1、3、7、14、30、60 天安排再次複習。')}<div class="stats"><div class="stat"><b>${learned()}</b><small>開始學習</small></div><div class="stat"><b>${state.favorites.length}</b><small>已收藏</small></div><div class="stat"><b>${xs.length}</b><small>待複習</small></div></div>${xs.length?xs.map(x=>card(x,true)).join(''):`<div class="empty" style="background:white;border-radius:20px;margin-top:24px"><span style="font-size:32px">✓</span><strong>今天都複習完成了</strong>回首頁繼續探索新的單字與詞句吧。</div><button class="btn big listen" data-nav="home">回到今日推薦</button>`}<p class="footer-note">提醒：本版沒有雲端同步，清除 Safari 網站資料會遺失紀錄。</p>`}
function settings(){return `${header('我的學習設定','學你真正用得上的英文。')}<div class="stats"><div class="stat"><b>${learned()}</b><small>開始學習</small></div><div class="stat"><b>${state.favorites.length}</b><small>已收藏</small></div><div class="stat"><b>${reviewedToday()}</b><small>今日練習</small></div></div><section class="form-card"><h3>我的英文程度</h3><p>推薦內容會依此挑選。可以隨時切換。</p><div class="setting-btns"><button class="setting-btn ${state.level==='A2'?'active':''}" data-level="A2">A2 基礎</button><button class="setting-btn ${state.level==='B1'?'active':''}" data-level="B1">B1 進階</button></div></section><section class="form-card"><h3>今日推薦主題</h3><p>首頁的推薦單字及詞句會依照主題更換。</p><div class="chip-row" style="margin:0;padding:0">${Object.entries(labels).map(([id,n])=>`<button class="chip ${state.category===id?'active':''}" data-topic="${id}">${n}</button>`).join('')}</div></section><section class="form-card"><h3>英文朗讀速度</h3><p>使用 iPhone Safari 的語音合成；音色依手機系統而異。</p><input style="width:100%;accent-color:#16827a" id="rate" type="range" min="0.6" max="1.2" step="0.1" value="${state.rate}"><div class="row"><span class="muted">較慢</span><span class="muted">較快</span></div></section><section class="form-card"><h3>學習資料</h3><p>目前紀錄只存在這個裝置。清除網站資料或移除網頁 App 可能造成紀錄遺失。</p><button class="btn weak" data-action="clear" style="width:100%">清除本機學習紀錄</button></section><p class="footer-note">WordFlow v0.1 · iPhone 試用版<br>正式 Flutter iOS App 將另行編譯為 IPA</p>`}
function render(){el('topLevel').textContent=state.level+' ↗';el('view').innerHTML=({home,library,review,settings}[tab])();document.querySelectorAll('[data-nav]').forEach(x=>x.classList.toggle('active',x.dataset.nav===tab));}
function go(t){tab=t;render();window.scrollTo({top:0,behavior:'smooth'});}
function speak(x){if(!('speechSynthesis'in window)){alert('目前瀏覽器不支援語音朗讀，建議改用 iPhone Safari。');return;}try{window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(x.english);u.lang='en-US';u.rate=Number(state.rate)||0.85;u.pitch=1;window.speechSynthesis.speak(u);}catch(e){alert('朗讀暫時無法使用，請確認手機音量設定。');}}
function study(x,remembered){const r=state.records[x.id]||{stage:0};const stages=[1,3,7,14,30,60];const stage=remembered?Math.min(5,(r.stage||0)+(r.last?1:0)):0;state.records[x.id]={stage,last:day(),next:remembered?daysFromToday(stages[stage]):day()};save();render();}
document.addEventListener('click',e=>{const n=e.target.closest('[data-nav]');if(n){go(n.dataset.nav);return;}const topic=e.target.closest('[data-topic]');if(topic){state.category=topic.dataset.topic;save();render();return;}const lev=e.target.closest('[data-level]');if(lev){state.level=lev.dataset.level;save();render();return;}const b=e.target.closest('[data-action]');if(!b)return;const x=ITEMS.find(i=>i.id===b.dataset.id);if(b.dataset.action==='clear'){if(confirm('確定清除所有收藏與練習紀錄嗎？')){state.records={};state.favorites=[];save();render();}return;}if(!x)return;switch(b.dataset.action){case'speak':speak(x);break;case'favorite':state.favorites=state.favorites.includes(x.id)?state.favorites.filter(v=>v!==x.id):[...state.favorites,x.id];save();render();break;case'remember':study(x,true);break;case'miss':study(x,false);break;}});
el('topLevel').addEventListener('click',()=>go('settings'));
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;el('libraryRows').innerHTML=libraryRows();}if(e.target.id==='rate'){state.rate=Number(e.target.value);save();}});
document.addEventListener('change',e=>{if(e.target.id==='catFilter'){categoryFilter=e.target.value;el('libraryRows').innerHTML=libraryRows();}if(e.target.id==='kindFilter'){kindFilter=e.target.value;el('libraryRows').innerHTML=libraryRows();}});
render();
</script>
</body></html>
