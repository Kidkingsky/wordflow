name: Flutter Android test build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create native Android project
        run: flutter create --platforms=android --project-name wordflow --org com.kidkingsky .
      - name: Install packages
        run: flutter pub get
      - name: Check and test
        run: |
          flutter analyze
          flutter test
      - name: Build Android debug APK
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: wordflow-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
