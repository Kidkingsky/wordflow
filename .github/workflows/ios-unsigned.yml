name: WordFlow iOS unsigned IPA for SideStore

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ios-unsigned:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create iOS native project
        run: flutter create --platforms=ios --project-name wordflow --org com.kidkingsky .
      - name: Remove generated counter-app template test
        run: rm -f test/widget_test.dart
      - name: Fetch packages
        run: flutter pub get
      - name: Read app version from pubspec
        run: |
          read -r APP_VERSION APP_BUILD <<< "$(ruby -ryaml -e 'puts YAML.load_file("pubspec.yaml").fetch("version").tr("+", " ")')"
          [[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$APP_BUILD" =~ ^[1-9][0-9]*$ ]]
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "APP_BUILD=$APP_BUILD" >> "$GITHUB_ENV"
          echo "Building WordFlow v$APP_VERSION (Build $APP_BUILD)"

      - name: Install WidgetKit extension
        run: |
          ruby -e "require 'xcodeproj'" || gem install xcodeproj --user-install --no-document
          ruby scripts/install_ios_widgets.rb
      - name: Verify experimental App Groups are declared for both targets
        run: |
          APP_GROUP='group.com.kidkingsky.wordflow'
          RUNNER_ENTITLEMENTS='ios/Runner/WordFlowAppGroups.entitlements'
          WIDGET_ENTITLEMENTS='ios/WordFlowWidgets/WordFlowAppGroups.entitlements'
          test -f "$RUNNER_ENTITLEMENTS"
          test -f "$WIDGET_ENTITLEMENTS"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' "$RUNNER_ENTITLEMENTS")" = "$APP_GROUP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' "$WIDGET_ENTITLEMENTS")" = "$APP_GROUP"
          ruby -rxcodeproj -e '
            project = Xcodeproj::Project.open("ios/Runner.xcodeproj")
            {"Runner" => "Runner/WordFlowAppGroups.entitlements",
             "WordFlowWidgets" => "WordFlowWidgets/WordFlowAppGroups.entitlements"}.each do |name, expected|
              target = project.targets.find { |t| t.name == name }
              abort "Missing #{name}" unless target
              abort "Missing group entitlement settings for #{name}" unless
                target.build_configurations.all? { |c|
                  c.build_settings["CODE_SIGN_ENTITLEMENTS"] == expected
                }
            end
          '
          grep -q 'WordFlowWidgetSyncBridge.register' ios/Runner/AppDelegate.swift
          echo "Source project requests shared App Groups, but signing support still needs an iPhone test."
      - name: Validate 1,500-word offline catalog
        run: python3 scripts/validate_content.py
      - name: Check Dart and test
        run: |
          flutter analyze --no-fatal-infos
          flutter test
      - name: Build iOS app without signing
        run: flutter build ios --release --no-codesign
      - name: Verify widgets are packaged inside the iOS app
        run: |
          APP="build/ios/iphoneos/Runner.app"
          EXT="$APP/PlugIns/WordFlowWidgets.appex"
          test -d "$EXT"
          test -s "$EXT/content.json"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = "$APP_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = "$APP_BUILD"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$EXT/Info.plist")" = "$APP_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$EXT/Info.plist")" = "$APP_BUILD"

          test "$(/usr/libexec/PlistBuddy -c 'Print :NSSupportsLiveActivities' "$APP/Info.plist")" = "true"

          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$EXT/Info.plist")" = "com.apple.widgetkit-extension"
          echo "Confirmed WidgetKit extension and offline lesson catalog"
      - name: Embed App Groups entitlements (ad-hoc signature)
        # `--no-codesign` leaves the binaries without any entitlements, so
        # SideStore re-signs the app WITHOUT App Groups and neither the app nor
        # the widget can open the shared container. An ad-hoc signature carries
        # the entitlements; SideStore reads them and registers the group.
        run: |
          APP="build/ios/iphoneos/Runner.app"
          EXT="$APP/PlugIns/WordFlowWidgets.appex"
          find "$APP/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -print0 2>/dev/null |
            while IFS= read -r -d '' lib; do
              codesign --force --sign - --timestamp=none "$lib"
            done
          codesign --force --sign - --timestamp=none             --entitlements ios/WordFlowWidgets/WordFlowAppGroups.entitlements "$EXT"
          codesign --force --sign - --timestamp=none             --entitlements ios/Runner/WordFlowAppGroups.entitlements "$APP"
          for bundle in "$APP" "$EXT"; do
            codesign -d --entitlements - --xml "$bundle" 2>&1 | tee /tmp/ent.xml
            grep -q 'group.com.kidkingsky.wordflow' /tmp/ent.xml || {
              echo "App Groups entitlement missing from $bundle"; exit 1; }
          done
          echo "App Groups entitlements embedded in app and widget"
      - name: Package app into unsigned IPA container
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/Runner.app
          cd build/ios/ipa
          zip -qry "WordFlow-v$APP_VERSION-b$APP_BUILD-unsigned.ipa" Payload
          rm -rf Payload
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WordFlow-iOS-v${{ env.APP_VERSION }}-b${{ env.APP_BUILD }}-unsigned-IPA-REQUIRES-SIGNING
          path: build/ios/ipa/WordFlow-v${{ env.APP_VERSION }}-b${{ env.APP_BUILD }}-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
