name: WordFlow iOS unsigned IPA for SideStore

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ios-unsigned:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create iOS native project
        run: flutter create --platforms=ios --project-name wordflow --org com.kidkingsky .
      - name: Remove generated counter-app template test
        run: rm -f test/widget_test.dart
      - name: Fetch packages
        run: flutter pub get
      - name: Install WidgetKit extension
        run: |
          ruby -e "require 'xcodeproj'" || gem install xcodeproj --user-install --no-document
          ruby scripts/install_ios_widgets.rb
      - name: Validate 1,500-word offline catalog
        run: python3 scripts/validate_content.py
      - name: Check Dart and test
        run: |
          flutter analyze --no-fatal-infos
          flutter test
      - name: Build iOS app without signing
        run: flutter build ios --release --no-codesign
      - name: Verify widgets are packaged inside the iOS app
        run: |
          APP="build/ios/iphoneos/Runner.app"
          EXT="$APP/PlugIns/WordFlowWidgets.appex"
          test -d "$EXT"
          test -s "$EXT/content.json"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSSupportsLiveActivities' "$APP/Info.plist")" = "true"

          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$EXT/Info.plist")" = "com.apple.widgetkit-extension"
          echo "Confirmed WidgetKit extension and offline lesson catalog"
      - name: Package app into unsigned IPA container
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/Runner.app
          cd build/ios/ipa
          zip -qry WordFlow-unsigned.ipa Payload
          rm -rf Payload
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WordFlow-iOS-unsigned-IPA-REQUIRES-SIGNING
          path: build/ios/ipa/WordFlow-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
