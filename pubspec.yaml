name: wordflow
description: A bilingual, offline-first daily English learning app for iOS and Android.
publish_to: none
version: 0.3.0+3

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.5
  package_info_plus: ^8.3.1
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/content/content.json
    - assets/content/word_families.json
